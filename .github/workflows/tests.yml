name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[contours,dev,examples]"
      - name: Test numerical core and contour adapter
        run: python -m pytest tests -q
      - name: Run standalone examples
        run: |
          python examples/quickstart.py
          python examples/oblique_contours.py
          python examples/plot_hdss_forward_validation.py --output results/forward_01_12.png
          python examples/plot_hdss_forward_validation.py --group 2 --output results/forward_13_24.png
      - name: Reproduce analytical benchmark
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python examples/analytical_benchmark.py --output-dir results/analytical
